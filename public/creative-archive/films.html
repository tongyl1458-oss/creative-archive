  <script>
    // Video data
    const videos = [
      {
        id: 1,
        title: '城市——重庆',
        category: 'projects',
        cover: 'videos/chongqing-cover.png',
        coverIsImage: true,
        videoSrc: 'videos/chongqing.mp4'
      },
      {

        title: '科普——AI',
        category: 'animations',
        cover: 'videos/ai-science.mp4#t=0.5',
        videoSrc: 'videos/ai-science.mp4'
      },
      {
        id: 3,
        title: 'AI——螺狮粉广告',
        category: 'projects',
        cover: 'videos/luosifen-cover.png',
        coverIsImage: true,
        videoSrc: 'videos/ai-luosifen-ad.mp4'
      },
      {
        id: 4,
        title: 'AI——鲲鹏',
        category: 'animations',
        cover: 'videos/ai-kunpeng.mp4#t=0.5',
        videoSrc: 'videos/ai-kunpeng.mp4'
      },
      {
        id: 5,
        title: 'AI——小狗玩偶',
        category: 'interactions',
        cover: 'videos/ai-puppy.mp4#t=0.5',
        videoSrc: 'videos/ai-puppy.mp4'
      },
      {
        id: 6,
        title: 'AI——重庆星露谷',
        category: 'projects',
        cover: 'videos/ai-chongqing-stardew.mp4#t=0.5',
        videoSrc: 'videos/ai-chongqing-stardew.mp4'
      }
    ];
    
    let currentVideoIndex = 0;
    let isAnimating = false;
    
    // === Film Reel with Inertial Scrolling ===
    let scrollOffset = 0; // Continuous float offset from current index
    let scrollVelocity = 0;
    let isDragging = false;
    let animationId = null;
    let lastSnapIndex = 0;
    
    // Target-based animation state (for thumbnail clicks)
    let targetAnimActive = false;
    let targetAnimStart = 0;
    let targetAnimFrom = 0;
    let targetAnimTo = 0;
    let targetAnimDuration = 0;
    
    // Normalize offset to shortest path range (-n/2 to n/2)
    function normalizeOffset(offset) {
      const n = videos.length;
      while (offset > n / 2) offset -= n;
      while (offset < -n / 2) offset += n;
      return offset;
    }
    
    // Generate film reel items
    function generateFilmReel() {
      const reel = document.getElementById('filmReel');
      reel.innerHTML = '';
      
      // Add focus indicator
      const focusIndicator = document.createElement('div');
      focusIndicator.className = 'focus-indicator';
      reel.appendChild(focusIndicator);
      
      // Create items for all videos
      videos.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'film-item';
        item.dataset.index = index;
        
        const textSpan = document.createElement('span');
        textSpan.className = 'item-text';
        textSpan.textContent = video.title;
        item.appendChild(textSpan);
        
        item.addEventListener('click', () => {
          selectVideo(index);
        });
        
        reel.appendChild(item);
      });
      
      // Update total count
      document.getElementById('filmIndexTotal').textContent = 
        String(videos.length).padStart(2, '0');
      
      // Initial render
      renderFilmReel();
    }
    
    function getItemHeight() {
      const panel = document.querySelector('.right-panel');
      return parseFloat(getComputedStyle(panel).getPropertyValue('--item-h')) || 52;
    }
    
    function getContainerHeight() {
      const panel = document.querySelector('.right-panel');
      return parseFloat(getComputedStyle(panel).getPropertyValue('--container-h')) || 360;
    }
    
    // Smooth easing function
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    
    // Calculate continuous offset with wrap-around
    function getWrappedOffset(itemIndex, currentOffset) {
      const total = videos.length;
      let offset = itemIndex - currentOffset;
      
      // Wrap to nearest equivalent position
      const half = total / 2;
      if (offset > half) offset -= total;
      if (offset < -half) offset += total;
      
      return offset;
    }
    
    // Render film reel with smooth continuous positioning
    function renderFilmReel() {
      const items = document.querySelectorAll('.film-item');
      const ITEM_HEIGHT = getItemHeight();
      const CONTAINER_HEIGHT = getContainerHeight();
      const centerY = CONTAINER_HEIGHT / 2;
      
      // Current "virtual" index (can be fractional due to scroll)
      const virtualIndex = currentVideoIndex + scrollOffset;
      
      // Find the closest integer index for active state
      const closestIndex = Math.round(virtualIndex);
      const normalizedClosest = ((closestIndex % videos.length) + videos.length) % videos.length;
      
      items.forEach((item, i) => {
        const offset = getWrappedOffset(i, virtualIndex);
        const absOffset = Math.abs(offset);
        
        // Position calculation
        const y = centerY + offset * ITEM_HEIGHT - ITEM_HEIGHT / 2;
        item.style.transform = `translateY(${y - centerY + ITEM_HEIGHT / 2}px)`;
        item.style.top = (centerY - ITEM_HEIGHT / 2) + 'px';
        
        // Smooth opacity gradient based on distance
        // Full opacity at center, fades out smoothly to 0 at ~2.5 items away
        const maxVisible = 2.5;
        let opacity = 0;
        
        if (absOffset < maxVisible) {
          // Non-linear fade for premium feel
          const t = absOffset / maxVisible;
          opacity = 1 - easeOutCubic(t);
          // Clamp
          opacity = Math.max(0, Math.min(1, opacity));
        }
        
        item.style.opacity = opacity;
        
        // Subtle scale - center slightly larger
        const scale = 1 - absOffset * 0.04;
        item.style.transform += ` scale(${Math.max(0.85, scale)})`;
        
        // Active state for closest item
        if (i === normalizedClosest && absOffset < 0.5) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
      
      // Update index display smoothly
      const displayIndex = normalizedClosest + 1;
      document.getElementById('filmIndexCurrent').textContent = 
        String(displayIndex).padStart(2, '0');
    }
    
    // Unified animation loop - handles both target-based and velocity-based scrolling
    function animateScroll(timestamp) {
      if (targetAnimActive) {
        // ===== Target-based animation (for clicking thumbnails) =====
        const progress = Math.min(1, (timestamp - targetAnimStart) / targetAnimDuration);
        const eased = easeOutCubic(progress);
        scrollOffset = targetAnimFrom + (targetAnimTo - targetAnimFrom) * eased;
        
        renderFilmReel();
        
        if (progress < 1) {
          animationId = requestAnimationFrame(animateScroll);
        } else {
          scrollOffset = targetAnimTo;
          targetAnimActive = false;
          renderFilmReel();
          
          // Finalize - ensure state is clean
          if (scrollOffset === 0) {
            lastSnapIndex = currentVideoIndex;
            onFilmSelectionChanged();
          }
          
          animationId = null;
        }
        return;
      }
      
      // ===== Velocity-based animation (for wheel, keyboard) =====
      const FRICTION = 0.92;
      const SNAP_THRESHOLD = 0.02;
      const SNAP_STIFFNESS = 0.15;
      
      // Apply friction
      scrollVelocity *= FRICTION;
      
      // Apply velocity to offset
      scrollOffset += scrollVelocity;
      
      // When velocity is very low, snap to nearest integer
      if (Math.abs(scrollVelocity) < SNAP_THRESHOLD) {
        const nearestIndex = Math.round(scrollOffset);
        const diff = nearestIndex - scrollOffset;
        
        if (Math.abs(diff) > 0.001) {
          // Spring-like snap
          scrollOffset += diff * SNAP_STIFFNESS;
          scrollVelocity = 0;
        } else {
          // Fully snapped
          scrollOffset = nearestIndex;
          scrollVelocity = 0;
          
          // Update current video index if it changed
          const newIndex = ((currentVideoIndex + nearestIndex) % videos.length + videos.length) % videos.length;
          if (newIndex !== lastSnapIndex) {
            lastSnapIndex = newIndex;
            currentVideoIndex = newIndex;
            scrollOffset = 0;
            onFilmSelectionChanged();
          }
          
          // Stop animation
          animationId = null;
          return;
        }
      }
      
      renderFilmReel();
      animationId = requestAnimationFrame(animateScroll);
    }
    
    // Start animation if not already running
    function startAnimation() {
      if (!animationId) {
        animationId = requestAnimationFrame(animateScroll);
      }
    }
    
    // Start a target-based scroll animation (guaranteed to land on target)
    function scrollToOffset(from, to, duration) {
      // Cancel any velocity-based scrolling
      scrollVelocity = 0;
      
      targetAnimActive = true;
      targetAnimStart = performance.now();
      targetAnimFrom = from;
      targetAnimTo = to;
      targetAnimDuration = duration;
      
      startAnimation();
    }
    
    // Handle wheel events on the film reel
    function handleWheel(e) {
      e.preventDefault();
      
      // Cancel any target-based animation
      targetAnimActive = false;
      
      // Add velocity based on wheel delta
      const delta = e.deltaY > 0 ? 1 : -1;
      scrollVelocity += delta * 0.15;
      
      // Clamp max velocity
      const maxVel = 0.6;
      scrollVelocity = Math.max(-maxVel, Math.min(maxVel, scrollVelocity));
      
      startAnimation();
    }
    
    // Update center player display to a specific video index
    function updateCenterDisplay(index) {
      const video = videos[index];
      
      // Update cover - support both image and video covers
      const coverVideo = document.getElementById('coverVideo');
      const coverImage = document.getElementById('coverImage');
      
      if (video.coverIsImage) {
        coverVideo.style.display = 'none';
        coverImage.style.display = 'block';
        coverImage.src = video.cover;
      } else {
        coverImage.style.display = 'none';
        coverVideo.style.display = 'block';
        coverVideo.src = video.videoSrc + '#t=0.5';
        coverVideo.load();
      }
      
      // Update title
      document.getElementById('videoTitleOverlay').textContent = video.title;
      
      // Update active thumbnail
      document.querySelectorAll('.thumbnail-item').forEach((thumb, i) => {
        thumb.classList.toggle('active', i === index);
      });
    }
    
    // Called when film selection settles on a new index
    function onFilmSelectionChanged() {
      updateCenterDisplay(currentVideoIndex);
    }
    
    // Select video - immediate state update + film reel scroll animation
    function selectVideo(index) {
      if (index === currentVideoIndex && scrollOffset === 0 && !targetAnimActive) return;
      
      // Save current visual position so the reel doesn't jump
      const oldVirtualIndex = currentVideoIndex + scrollOffset;
      
      // Immediately sync all state to the new index
      // This ensures center player, play button, etc. all use the correct video
      currentVideoIndex = index;
      
      // Calculate initial offset (maintains visual continuity)
      // and normalize to shortest path for smooth, short animation
      let rawOffset = oldVirtualIndex - index;
      let initialOffset = normalizeOffset(rawOffset);
      
      scrollOffset = initialOffset;
      
      // Immediately update center player display
      updateCenterDisplay(index);
      
      // Use target-based animation to guarantee we land exactly on target
      // Duration scales slightly with distance for natural feel
      const distance = Math.abs(initialOffset);
      const duration = 500 + distance * 80; // base 500ms + 80ms per step
      
      scrollToOffset(initialOffset, 0, duration);
    }
    
    // Navigate film reel (for keyboard and wheel)
    function navigateFilm(direction) {
      // Cancel any target-based animation
      targetAnimActive = false;
      scrollVelocity += direction * 0.4;
      startAnimation();
    }
    
    // Generate thumbnails in a circle
    function generateThumbnails() {
      const ring = document.getElementById('thumbnailsRing');
      const radius = 240; // radius of the ring
      
      videos.forEach((video, index) => {
        const angle = (index / videos.length) * 360;
        const radian = (angle * Math.PI) / 180;
        
        const x = Math.cos(radian) * radius;
        const y = Math.sin(radian) * radius;
        
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail-item' + (index === 0 ? ' active' : '');
        thumb.dataset.index = index;
        thumb.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
        
        // Use image or video for cover
        let coverHtml = '';
        if (video.coverIsImage) {
          coverHtml = `<img src="${video.cover}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
        } else {
          coverHtml = `<video src="${video.cover}" muted preload="none" playsinline></video>`;
        }
        
        thumb.innerHTML = `
          <div class="thumbnail-inner">
            ${coverHtml}
          </div>
        `;
        
        thumb.addEventListener('click', () => selectVideo(index));
        thumb.addEventListener('dblclick', () => { selectVideo(index); playVideo(); });
        ring.appendChild(thumb);
      });
    }
    
    // Play video - open modal with card-style player
    function playVideo() {
      const video = videos[currentVideoIndex];
      const modal = document.getElementById('videoModal');
      const videoEl = document.getElementById('modalVideo');
      const playOverlay = document.getElementById('modalPlayOverlay');
      const playerCard = document.querySelector('.player-card');
      const videoWrap = document.getElementById('playerVideoWrap');
      
      // Reset card size to default first (portrait)
      playerCard.style.width = '';
      videoWrap.style.aspectRatio = '';
      
      // Adjust player size based on video aspect ratio
      function adjustPlayerSize() {
        const vWidth = videoEl.videoWidth;
        const vHeight = videoEl.videoHeight;
        
        if (!vWidth || !vHeight) return; // metadata not ready
        
        const aspectRatio = vWidth / vHeight;
        
        // Calculate available screen space - video takes full card since no title/controls outside
        const maxCardWidth = window.innerWidth * 0.96;
        const maxCardHeight = window.innerHeight * 0.96;

        const availableVideoHeight = maxCardHeight;
        const availableVideoWidth = maxCardWidth;

        // Calculate max video size that fits within available space
        // while maintaining the original aspect ratio
        let videoWidth, videoHeight;

        // Try fitting by width first
        videoWidth = availableVideoWidth;
        videoHeight = videoWidth / aspectRatio;

        // If height exceeds available space, fit by height instead
        if (videoHeight > availableVideoHeight) {
          videoHeight = availableVideoHeight;
          videoWidth = videoHeight * aspectRatio;
        }

        // Set video wrap aspect ratio to match original video
        videoWrap.style.aspectRatio = `${vWidth} / ${vHeight}`;

        // Set card width based on video width
        playerCard.style.width = Math.max(320, videoWidth) + 'px';
      }
      
      // Add listener BEFORE load() so we don't miss cached videos
      const handleMetaLoad = () => {
        adjustPlayerSize();
        videoEl.removeEventListener('loadedmetadata', handleMetaLoad);
      };
      videoEl.addEventListener('loadedmetadata', handleMetaLoad);
      
      // Set video source - unmuted since user clicks play button (user gesture)
      videoEl.src = video.videoSrc;
      videoEl.load();
      videoEl.muted = false;
      videoEl.volume = 0.8;
      
      // In case metadata is already available (cached video)
      if (videoEl.videoWidth && videoEl.videoHeight) {
        adjustPlayerSize();
        videoEl.removeEventListener('loadedmetadata', handleMetaLoad);
      }
      
      // Reset to paused state
      playOverlay.classList.remove('hidden');
      updatePlayPauseIcon(false);
      updateVolumeIcon(false);
      
      // Reset progress
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('currentTime').textContent = '0:00';
      document.getElementById('durationTime').textContent = '0:00';
      
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    // Close modal and stop video
    function closeModal() {
      const modal = document.getElementById('videoModal');
      const videoEl = document.getElementById('modalVideo');
      const playerCard = document.querySelector('.player-card');
      const videoWrap = document.getElementById('playerVideoWrap');
      
      // Pause and clear video to stop sound immediately
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      
      // Reset card size
      playerCard.style.width = '';
      videoWrap.style.aspectRatio = '';
      
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
    
    // Handle window resize - adjust player size when modal is open
    function handleResize() {
      const modal = document.getElementById('videoModal');
      if (!modal.classList.contains('active')) return;
      
      const videoEl = document.getElementById('modalVideo');
      if (videoEl.videoWidth && videoEl.videoHeight) {
        // Re-adjust player size based on new window dimensions
        const playerCard = document.querySelector('.player-card');
        const videoWrap = document.getElementById('playerVideoWrap');
        const vWidth = videoEl.videoWidth;
        const vHeight = videoEl.videoHeight;
        const aspectRatio = vWidth / vHeight;
        
        const maxCardWidth = window.innerWidth * 0.92;
        const maxCardHeight = window.innerHeight * 0.92;
        const cardPadding = 56;
        const infoHeight = 70;
        const controlsHeight = 80;
        const gap = 48;
        
        const availableVideoHeight = maxCardHeight - cardPadding - infoHeight - controlsHeight - gap;
        const availableVideoWidth = maxCardWidth - 56;
        
        let videoWidth = availableVideoWidth;
        let videoHeight = videoWidth / aspectRatio;
        
        if (videoHeight > availableVideoHeight) {
          videoHeight = availableVideoHeight;
          videoWidth = videoHeight * aspectRatio;
        }
        
        videoWrap.style.aspectRatio = `${vWidth} / ${vHeight}`;
        const cardWidth = videoWidth + 56;
        playerCard.style.width = Math.max(320, cardWidth) + 'px';
      }
    }
    
    // Toggle play/pause
    function togglePlay() {
      const videoEl = document.getElementById('modalVideo');
      const playOverlay = document.getElementById('modalPlayOverlay');
      
      if (videoEl.paused) {
        videoEl.play();
        playOverlay.classList.add('hidden');
        updatePlayPauseIcon(true);
      } else {
        videoEl.pause();
        playOverlay.classList.remove('hidden');
        updatePlayPauseIcon(false);
      }
    }
    
    // Update play/pause button icon
    function updatePlayPauseIcon(isPlaying) {
      const icon = document.getElementById('playPauseIcon');
      if (isPlaying) {
        icon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
      } else {
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }
    
    // Update volume icon
    function updateVolumeIcon(isMuted) {
      const icon = document.getElementById('volumeIcon');
      if (isMuted) {
        icon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
      } else {
        icon.innerHTML = '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
      }
    }
    
    // Toggle mute
    function toggleMute() {
      const videoEl = document.getElementById('modalVideo');
      videoEl.muted = !videoEl.muted;
      updateVolumeIcon(videoEl.muted);
    }
    
    // Play next/previous video in modal
    function playNextVideo() {
      const next = (currentVideoIndex + 1) % videos.length;
      selectVideo(next);
      playVideo();
      // Auto-play the new video
      setTimeout(() => {
        const videoEl = document.getElementById('modalVideo');
        videoEl.play();
        document.getElementById('modalPlayOverlay').classList.add('hidden');
        updatePlayPauseIcon(true);
      }, 100);
    }
    
    function playPrevVideo() {
      const prev = (currentVideoIndex - 1 + videos.length) % videos.length;
      selectVideo(prev);
      playVideo();
      setTimeout(() => {
        const videoEl = document.getElementById('modalVideo');
        videoEl.play();
        document.getElementById('modalPlayOverlay').classList.add('hidden');
        updatePlayPauseIcon(true);
      }, 100);
    }
    
    // Format time
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    // Update progress
    function updateProgress() {
      const videoEl = document.getElementById('modalVideo');
      const progressFill = document.getElementById('progressFill');
      const currentTimeEl = document.getElementById('currentTime');
      const durationTimeEl = document.getElementById('durationTime');
      
      if (videoEl.duration) {
        const percent = (videoEl.currentTime / videoEl.duration) * 100;
        progressFill.style.width = percent + '%';
        currentTimeEl.textContent = formatTime(videoEl.currentTime);
        durationTimeEl.textContent = formatTime(videoEl.duration);
      }
    }
    
    // Seek video
    function seekVideo(e) {
      const videoEl = document.getElementById('modalVideo');
      const progressBar = document.getElementById('progressBar');
      const rect = progressBar.getBoundingClientRect();
      const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      videoEl.currentTime = percent * videoEl.duration;
    }
    
    // Event listeners
    document.getElementById('playButton').addEventListener('click', playVideo);
    document.getElementById('videoCover').addEventListener('click', playVideo);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('videoModal').addEventListener('click', (e) => {
      if (e.target.id === 'videoModal' || e.target.classList.contains('modal-bg')) closeModal();
    });
    
    // Video player controls
    document.getElementById('modalPlayOverlay').addEventListener('click', togglePlay);
    document.getElementById('playPauseBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      togglePlay();
    });
    document.getElementById('prevBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      playPrevVideo();
    });
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      playNextVideo();
    });
    document.getElementById('muteBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      toggleMute();
    });
    document.getElementById('progressBar').addEventListener('click', function(e) {
      e.stopPropagation();
      seekVideo(e);
    });
    
    // Video element events
    const videoEl = document.getElementById('modalVideo');
    videoEl.addEventListener('timeupdate', updateProgress);
    videoEl.addEventListener('loadedmetadata', updateProgress);
    videoEl.addEventListener('ended', function() {
      const playOverlay = document.getElementById('modalPlayOverlay');
      playOverlay.classList.remove('hidden');
      updatePlayPauseIcon(false);
    });
    videoEl.addEventListener('click', togglePlay);
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') {
        const prev = (currentVideoIndex - 1 + videos.length) % videos.length;
        selectVideo(prev);
      }
      if (e.key === 'ArrowRight') {
        const next = (currentVideoIndex + 1) % videos.length;
        selectVideo(next);
      }
      if (e.key === ' ' && !document.getElementById('videoModal').classList.contains('active')) {
        e.preventDefault();
        playVideo();
      }
      // Space toggles play when modal is open
      if (e.key === ' ' && document.getElementById('videoModal').classList.contains('active')) {
        e.preventDefault();
        togglePlay();
      }
      // M key toggles mute
      if ((e.key === 'm' || e.key === 'M') && document.getElementById('videoModal').classList.contains('active')) {
        toggleMute();
      }
    });
    
    // Window resize - adjust player size when modal is open
    window.addEventListener('resize', handleResize);
    
    // Mouse wheel navigation on right panel - inertial scrolling
    document.querySelector('.right-panel').addEventListener('wheel', handleWheel, { passive: false });
    
    // Also allow wheel navigation anywhere on page for better UX
    document.addEventListener('wheel', (e) => {
      // Only trigger if not scrolling inside modal
      if (!document.getElementById('videoModal').classList.contains('active')) {
        handleWheel(e);
      }
    }, { passive: false });
    
    // Initialize
    lastSnapIndex = 0;
    generateFilmReel();
    generateThumbnails();
    onFilmSelectionChanged();

    /* ============================================================
     * 禁用右键保存 / 图片拖拽（保护素材）
     * ============================================================ */
    document.addEventListener('contextmenu', function(e) {
      if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
        e.preventDefault();
      }
    });
    document.addEventListener('dragstart', function(e) {
      if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
