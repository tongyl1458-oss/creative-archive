<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #c0c0c0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  min-height: 100vh;
  user-select: none;
}
.game-frame {
  background: #c0c0c0;
  border: 3px solid;
  border-color: #fff #808080 #808080 #fff;
  padding: 6px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #808080 #fff #fff #808080;
  padding: 4px 6px;
  margin-bottom: 6px;
}
.counter {
  background: #000;
  color: #f00;
  font-family: 'Courier New', monospace;
  font-size: 22px;
  font-weight: bold;
  padding: 2px 4px;
  border: 1px solid;
  border-color: #808080 #fff #fff #808080;
  letter-spacing: 2px;
  min-width: 48px;
  text-align: center;
}
.smiley-btn {
  width: 28px;
  height: 28px;
  border: 2px solid;
  border-color: #fff #808080 #808080 #fff;
  background: #c0c0c0;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.smiley-btn:active {
  border-color: #808080 #fff #fff #808080;
}
.grid {
  display: grid;
  gap: 0;
  border: 2px solid;
  border-color: #808080 #fff #fff #808080;
}
.cell {
  width: 22px;
  height: 22px;
  background: #c0c0c0;
  border: 2px solid;
  border-color: #fff #808080 #808080 #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
}
.cell.revealed {
  border: 1px solid #808080;
  background: #c0c0c0;
  cursor: default;
}
.cell.mine {
  background: #f00;
}
.cell.flagged::after {
  content: '🚩';
  font-size: 12px;
}
.cell.questioned::after {
  content: '?';
  color: #000;
}
.num1 { color: #0000ff; }
.num2 { color: #008000; }
.num3 { color: #ff0000; }
.num4 { color: #000080; }
.num5 { color: #800000; }
.num6 { color: #008080; }
.num7 { color: #000000; }
.num8 { color: #808080; }
.difficulty-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.diff-btn {
  padding: 4px 12px;
  border: 2px solid;
  border-color: #fff #808080 #808080 #fff;
  background: #c0c0c0;
  cursor: pointer;
  font-size: 13px;
}
.diff-btn.active {
  border-color: #808080 #fff #fff #808080;
  font-weight: bold;
}
.diff-btn:active {
  border-color: #808080 #fff #fff #808080;
}
.status-msg {
  margin-top: 10px;
  font-size: 14px;
  font-weight: bold;
  color: #000;
}

/* Mobile responsive */
@media (max-width: 768px) {
  body { padding: 6px; }
  .cell {
    width: 28px;
    height: 28px;
    font-size: 16px;
  }
  .cell.flagged::after { font-size: 14px; }
  .counter { font-size: 18px; min-width: 40px; }
  .smiley-btn { width: 32px; height: 32px; font-size: 20px; }
  .diff-btn { font-size: 11px; padding: 4px 8px; }
  .header { padding: 4px 4px; }
}

@media (max-width: 480px) {
  .cell {
    width: 30px;
    height: 30px;
    font-size: 16px;
  }
  .difficulty-bar { gap: 4px; }
  .diff-btn { font-size: 10px; padding: 3px 6px; }
  .game-frame { padding: 4px; }
}

/* Prevent context menu on long-press for mobile */
.cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>

<div class="difficulty-bar">
  <button class="diff-btn active" data-level="easy">初级 9×9</button>
  <button class="diff-btn" data-level="medium">中级 16×16</button>
  <button class="diff-btn" data-level="hard">高级 16×30</button>
</div>

<div class="game-frame">
  <div class="header">
    <div class="counter" id="mineCount">010</div>
    <button class="smiley-btn" id="smiley">🙂</button>
    <div class="counter" id="timer">000</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="status-msg" id="status"></div>

<script>
const LEVELS = {
  easy:   { rows: 9,  cols: 9,  mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 },
};

let level = 'easy';
let rows, cols, mineCount;
let board = [];
let revealed = [];
let flagState = [];
let minePositions = [];
let gameOver = false;
let gameWon = false;
let firstClick = true;
let timerInterval = null;
let timeElapsed = 0;
let flagsPlaced = 0;

const gridEl = document.getElementById('grid');
const mineCountEl = document.getElementById('mineCount');
const timerEl = document.getElementById('timer');
const smileyEl = document.getElementById('smiley');
const statusEl = document.getElementById('status');

function init() {
  const cfg = LEVELS[level];
  rows = cfg.rows;
  cols = cfg.cols;
  mineCount = cfg.mines;

  board = Array(rows).fill().map(() => Array(cols).fill(0));
  revealed = Array(rows).fill().map(() => Array(cols).fill(false));
  flagState = Array(rows).fill().map(() => Array(cols).fill(0));
  minePositions = [];
  gameOver = false;
  gameWon = false;
  firstClick = true;
  timeElapsed = 0;
  flagsPlaced = 0;

  clearInterval(timerInterval);
  timerInterval = null;

  updateMineCount();
  updateTimer();
  smileyEl.textContent = '🙂';
  statusEl.textContent = '';

  renderGrid();
  notifyResize();
}

function notifyResize() {
  const cellSize = window.innerWidth <= 480 ? 30 : (window.innerWidth <= 768 ? 28 : 22);
  const gridW = cols * cellSize + 4;
  const gridH = rows * cellSize + 4;
  const totalW = gridW + 24;
  const totalH = gridH + 165;
  window.parent.postMessage({
    type: 'minesweeper-resize',
    width: totalW,
    height: totalH
  }, '*');
}

function renderGrid() {
  const cellSize = window.innerWidth <= 480 ? 30 : (window.innerWidth <= 768 ? 28 : 22);
  gridEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  gridEl.innerHTML = '';

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;

      cell.addEventListener('click', handleClick);
      cell.addEventListener('contextmenu', handleRightClick);

      gridEl.appendChild(cell);
    }
  }
}

function getCell(r, c) {
  return gridEl.children[r * cols + c];
}

function placeMines(safeR, safeC) {
  const positions = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
      positions.push([r, c]);
    }
  }
  for (let i = positions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }
  const count = Math.min(mineCount, positions.length);
  for (let i = 0; i < count; i++) {
    const [r, c] = positions[i];
    board[r][c] = -1;
    minePositions.push([r, c]);
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (board[r][c] === -1) continue;
      let count2 = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count2++;
        }
      }
      board[r][c] = count2;
    }
  }
}

function handleClick(e) {
  if (gameOver) return;
  const r = parseInt(e.currentTarget.dataset.row);
  const c = parseInt(e.currentTarget.dataset.col);
  if (flagState[r][c] !== 0) return;
  if (revealed[r][c]) return;

  if (firstClick) {
    placeMines(r, c);
    firstClick = false;
    startTimer();
  }

  if (board[r][c] === -1) {
    revealCell(r, c);
    getCell(r, c).classList.add('mine');
    endGame(false);
    return;
  }

  revealCell(r, c);
  checkWin();
}

function revealCell(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagState[r][c] !== 0) return;

  revealed[r][c] = true;
  const cell = getCell(r, c);
  cell.classList.add('revealed');

  if (board[r][c] === -1) {
    cell.textContent = '💣';
    return;
  }

  if (board[r][c] > 0) {
    cell.textContent = board[r][c];
    cell.classList.add('num' + board[r][c]);
  }

  if (board[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        revealCell(r + dr, c + dc);
      }
    }
  }
}

function handleRightClick(e) {
  e.preventDefault();
  if (gameOver) return;
  const r = parseInt(e.currentTarget.dataset.row);
  const c = parseInt(e.currentTarget.dataset.col);
  if (revealed[r][c]) return;

  const cell = getCell(r, c);
  flagState[r][c] = (flagState[r][c] + 1) % 3;

  cell.classList.remove('flagged', 'questioned');
  if (flagState[r][c] === 1) {
    cell.classList.add('flagged');
    flagsPlaced++;
  } else if (flagState[r][c] === 2) {
    cell.classList.add('questioned');
    flagsPlaced--;
  } else {
    if (flagState[r][c] === 0 && flagsPlaced > 0) flagsPlaced--;
  }

  updateMineCount();
}

function updateMineCount() {
  const remaining = mineCount - flagsPlaced;
  mineCountEl.textContent = String(Math.max(0, remaining)).padStart(3, '0');
}

function updateTimer() {
  timerEl.textContent = String(Math.min(999, timeElapsed)).padStart(3, '0');
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeElapsed++;
    updateTimer();
  }, 1000);
}

function checkWin() {
  let unrevealed = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!revealed[r][c] && board[r][c] !== -1) unrevealed++;
    }
  }
  if (unrevealed === 0) endGame(true);
}

function endGame(won) {
  gameOver = true;
  clearInterval(timerInterval);

  if (won) {
    smileyEl.textContent = '😎';
    statusEl.textContent = '🎉 恭喜！你赢了！';
    for (const [r, c] of minePositions) {
      if (!revealed[r][c]) {
        revealed[r][c] = true;
        const cell = getCell(r, c);
        cell.classList.add('revealed', 'flagged');
        cell.classList.remove('mine');
      }
    }
  } else {
    smileyEl.textContent = '😵';
    statusEl.textContent = '💥 踩到雷了！点击笑脸重新开始';
    for (const [r, c] of minePositions) {
      if (!revealed[r][c]) {
        revealed[r][c] = true;
        const cell = getCell(r, c);
        cell.classList.add('revealed');
        cell.textContent = '💣';
      }
    }
  }
}

smileyEl.addEventListener('click', init);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    level = btn.dataset.level;
    init();
  });
});

init();
</script>
</body>
</html>
